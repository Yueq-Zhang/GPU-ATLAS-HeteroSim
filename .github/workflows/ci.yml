name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python test dependencies
        run: python -m pip install -e ".[test]"
      - name: Configure C++
        run: cmake -S simulator -B simulator/build -DCMAKE_BUILD_TYPE=Release
      - name: Build C++
        run: cmake --build simulator/build --parallel 2
      - name: Test C++
        run: ctest --test-dir simulator/build --output-on-failure
      - name: Test Python
        run: python -m pytest tests/hetero
      - name: Validate smoke configuration
        run: python -m frontend.hetero.cli validate --config configs/hetero/experiments/m0_smoke.yaml

