notes:
  - Local GPU is NVIDIA GeForce RTX 3070 (SM86); pinned SM86_RTX3070 configs are used.
  - Accel-Sim 2.0 uses the rebuilt NVBit 1.8 tracer and compressed .tracez format; local RTX 3070 driver 591.86 capture and adapter-equivalence qualification passed on 2026-08-27.
  - The Accel-Sim 2.0 source archive does not pin GPGPU-Sim; the exact inspected dev revision is pinned here for reproducibility.
  - M5 Step 1 is an independent total-duration backend; Accel-Sim exclusively owns GPU core, cache, NoC and local DRAM timing.
  - ATLAS, Ramulator2, BookSim2 and TileLang revisions are pinned; only paths with explicit qualification records may be reported.
  - P1-P7 qualify external-link timing, Logic-Die parent/child splitting, bandwidth consistency and dual-initiator memory-port contention.
  - P9b qualifies real Accel-Sim and a complete atlasim.Chip concurrently against one Ramulator2 for one fixed TinyLlama q_proj contention workload; this is not an end-to-end placement schedule.
  - P10a qualifies strict one-node/one-device-task placement, per-value versioned routes and timed residency events in the reference control plane; real multi-operator cycle coupling remains pending.
  - P10b-B qualifies dependency-, resource-, route-, version- and live request-completion gating for one mixed TinyLlama Prefill layer through one Ramulator2.
  - P11-P14 deploy a complete materialized TinyLlama-1.1B FP16 BS=1 Context=1024 Prefill graph through first-token sampling; compute uses uncalibrated tiled cycle contracts and memory uses bounded representative requests, so performance claims remain disabled.
  - P27 qualifies the pinned ATLAS-patched BookSim2 through an isolated per-cycle adapter and one memory-side Gateway ingress into the single Ramulator2 owner; full-Chip NoC coverage and performance calibration remain pending.
  - P29 installs Hugging Face, vLLM and TensorRT-LLM in three isolated environments on local SM86 and remote SM89. P34 connects real remote vLLM Scheduler/Block Table and TensorRT-LLM Engine/Profile/SimpleScheduler events; the TensorRT path remains the PyTorch backend.
  - P30 connects one fixed remote Hugging Face Prefill plus Decode request to stable operator, Tensor, alias, allocator and Simulation Key records; allocation-specific hashes remain separate because CUDA workspace reuse may vary.
  - P31 captures the framework-selected Layer-0 Decode SASS on remote SM89, preserves actual SM86 trace headers, and builds a Range-Rebase GPU Artifact plus a deterministic 16-core ATLAS QKV full-memory Trace.
  - P33 qualifies deterministic double replay of the 40-kernel GPU Artifact and the complete 338,080-request ATLAS stream, with one Ramulator2 per leg, durable conservation and zero in-flight requests.
  - P32 joins the fixed Hugging Face request and both qualified Artifacts as non-additive reference/candidate branches; because the GPU whole-layer Trace already includes QKV, mixed-placement makespan remains unqualified.
  - P34 qualifies real vLLM and TensorRT-LLM online event adapters by double run. No P32-P34 evidence enables a performance claim.
