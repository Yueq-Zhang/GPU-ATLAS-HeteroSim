Frontend:
  impl: HBFrontend
  clock_ratio: 1

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 1
  DRAM:
    impl: HBDRAM
    org:
      preset: HBDRAM_256Mb_64pin_16KB_edge
      channel: 8
    timing:
      preset: HBDRAM_400Mbps
  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy
    plugins:
  AddrMapper:
    impl: OneLevelInterleave
    channel_lowest_bit: 0
