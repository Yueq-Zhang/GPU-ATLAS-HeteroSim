Frontend:
  impl: HBFrontend
  clock_ratio: 1

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 1
  DRAM:
    impl: HBDRAM
    org:
      preset: HBDRAM_2Gb_512pin
      channel: 1
      dq: 512
      channel_width: 512
      internal_prefetch_size: 1
    timing:
      preset: HBDRAM_400Mbps
  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy
    plugins:
  AddrMapper:
    impl: OneLevelInterleave
    channel_lowest_bit: 0
